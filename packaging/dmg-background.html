<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@500&family=IBM+Plex+Sans+Arabic:wght@500&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 660 x 400 DMG window. Icons sit at (170,190) and (490,190); the arrow runs between them. */
html,body{margin:0;width:660px;height:400px;overflow:hidden}
body{background:#eeefea;position:relative;font-family:"Instrument Sans","Helvetica Neue",sans-serif;color:#15181a}
.grid{position:absolute;inset:0;background-image:linear-gradient(#15181a0d 1px,transparent 1px),linear-gradient(90deg,#15181a0d 1px,transparent 1px);background-size:20px 20px;}
.fade{position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 47%, #eeefea 30%, #eeefeaee 55%, #eeefea00 100%)}
.top{position:absolute;top:22px;left:0;right:0;text-align:center;font:500 11px/1 "JetBrains Mono",monospace;letter-spacing:.12em;color:#80867c;text-transform:uppercase}
svg.arrow{position:absolute;left:250px;top:166px;width:160px;height:48px}
.bottom{position:absolute;left:0;right:0;bottom:46px;text-align:center}
.bottom .en{font:700 19px/1.2 "Bricolage Grotesque",sans-serif;letter-spacing:-.01em}
.bottom .ar{font:500 15px/1.4 "IBM Plex Sans Arabic","Geeza Pro",sans-serif;color:#555b52;margin-top:6px;direction:rtl}
.chip{display:inline-block;font:500 11px/1 "JetBrains Mono",monospace;background:#c9f23e;color:#101211;border-radius:4px;padding:3px 5px;vertical-align:2px}
</style></head><body>
<div class="grid"></div><div class="fade"></div>
<div class="top">Bremorph 1.0 · macOS 13+</div>
<svg class="arrow" viewBox="0 0 160 48" fill="none">
  <path d="M6 24 H140" stroke="#15181a" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
  <path d="M128 11 L148 24 L128 37" stroke="#15181a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="bottom">
  <div class="en">Drag Bremorph into Applications</div>
  <div class="ar">اسحب Bremorph إلى مجلد التطبيقات</div>
</div>
</body></html>
